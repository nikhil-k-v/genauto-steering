<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steering capture</title>
<style>
  @font-face { font-family: "Barlow"; font-weight: 400; src: url(/fonts/Barlow-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; src: url(/fonts/Barlow-SemiBold.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url(/fonts/BarlowSemiCondensed-Medium.woff2) format("woff2"); }
  /* same system as the laptop app: colour means status, everything else is ink on paper */
  :root { --paper:#f4f5f6; --surface:#fff; --ink:#1b2129; --muted:#68717c; --faint:#a3aab3; --rule:#d2d6db;
          --ok:#2f8a57; --warn:#b5750e; --bad:#c2362d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font: 16px/1.45 "Barlow", -apple-system, system-ui, sans-serif;
         font-variant-numeric: tabular-nums; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
  .card { background: var(--surface); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grp { display:grid; grid-template-columns: 1fr 1fr; gap:4px 14px; }
  .g { display:flex; align-items:center; gap:8px; }
  .g i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .g.ok i { background: var(--ok); } .g.blk i { background: var(--warn); } .g.bad i { background: var(--bad); }
  .g.unk i { border: 1.6px solid var(--faint); }
  .big { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-size: 44px; font-weight: 500; line-height: 1.05; }
  .dim { color: var(--muted); font-size: 14px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--rule); border-radius: 6px; padding: 11px 14px; background: var(--surface); color: var(--ink); }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  button.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  button:disabled { color: var(--faint); background: var(--paper); }
  video { width:100%; border-radius: 6px; background:#000; max-height: 38vh; object-fit: cover; }
  .pill { font-size: 14px; color: var(--muted); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }
  ul { margin: 8px 0 0; padding-left: 18px; font-size: 15px; } ul li b { font-weight: 600; }
</style>
</head>
<body>
<h1>Steering capture</h1>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span>Hub <span id="ws" class="pill">connecting</span></span>
    <span>Clock <span id="sync" class="pill">—</span></span>
    <span>Rec <span id="rec" class="pill">idle</span></span>
  </div>
</div>

<div class="card">
  <div class="grp" id="groups"></div>
  <ul id="bad"></ul>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div><div id="cs" style="font-weight:600;font-size:20px">—</div><div class="big" id="pos">—</div><div class="dim">target <span id="sp">—</span></div></div>
  </div>
</div>

<div class="card">
  <video id="cam" autoplay playsinline muted></video>
  <div class="row" style="margin-top:10px">
    <button id="arm" class="primary">Arm camera</button>
    <button id="imu">Arm IMU</button>
    <span class="dim" id="capinfo">Camera records automatically while a recording is active on the laptop.</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="recstart">Start recording</button>
    <button id="recstop">Stop recording</button>
    <button id="estop" class="danger">Stop motor</button>
  </div>
  <div class="dim" id="cmdres" style="margin-top:6px"></div>
</div>

<script>
// ---------------- websocket + time sync ----------------
const $ = id => document.getElementById(id);
let ws, offsets = [], offset = 0, jitter = null, synced = false;
let recording = null;            // {active, uid, name, created_at_ms}
let armed = false, imuArmed = false, mediaStream = null, recorder = null, chunks = [], captureStartServerMs = 0;
let imuBuf = [];

const serverNow = () => performance.timeOrigin + performance.now() + offset;   // ms, server clock

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("ws").textContent = "connected"; $("ws").className = "pill ok"; sync(); };
  ws.onclose = () => { $("ws").textContent = "reconnecting"; $("ws").className = "pill bad"; synced = false; setTimeout(connect, 1500); };
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function sync() {
  // NTP-style: 8 pings, keep the ones with the shortest round trip
  for (let i = 0; i < 8; i++) setTimeout(() => send({type: "ping", t0: performance.timeOrigin + performance.now()}), i * 120);
}
setInterval(sync, 10000);
setInterval(() => send({type: "sync", offset_ms: offset, jitter_ms: jitter, capturing: !!(recorder && recorder.state === "recording")}), 1000);

function handle(m) {
  if (m.type === "pong") {
    const t1 = performance.timeOrigin + performance.now();
    const rtt = t1 - m.t0;
    const off = m.server_ms - (m.t0 + t1) / 2;
    offsets.push({off, rtt}); if (offsets.length > 24) offsets.shift();
    const best = offsets.slice().sort((a, b) => a.rtt - b.rtt).slice(0, Math.max(3, offsets.length >> 1)).map(o => o.off).sort((a, b) => a - b);
    offset = best[best.length >> 1];
    jitter = best.length > 2 ? best[best.length - 1] - best[0] : null;
    synced = true;
    $("sync").textContent = `${offset.toFixed(0)} ms ±${jitter == null ? "?" : jitter.toFixed(0)}`;
    $("sync").className = "pill " + (jitter != null && jitter < 50 ? "ok" : "bad");
  } else if (m.type === "hello") { setRecording(m.recording); }
  else if (m.type === "recording") { setRecording(m); }
  else if (m.type === "telemetry") {
    const names = ["Resting", "Holding", "Following", "Testing", "Free-spin", "Calibrating", "Tripped"];
    const sg = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1) + "°";
    $("cs").textContent = names[m.cs] || m.cs; $("cs").style.color = m.cs === 6 ? "var(--bad)" : "";
    $("pos").textContent = sg(m.pos); $("sp").textContent = sg(m.sp);
  } else if (m.type === "health") {
    const cls = {0: "unk", 1: "ok", 2: "blk", 3: "bad"};
    const title = {C: "Link", S: "Safety", M: "Motor", T: "Teensy", D: "Data"};
    $("groups").innerHTML = ["C", "S", "M", "T", "D"].map(g => `<div class="g ${cls[m.groups[g]]}"><i></i>${title[g]}</div>`).join("");
    $("bad").innerHTML = m.bad.filter(b => b.s !== 1).slice(0, 6).map(b => `<li><b>${b.id}</b> ${["unknown", "ok", "blocked", "failed"][b.s]}: ${b.r}</li>`).join("");
  } else if (m.type === "cmd_result") { $("cmdres").textContent = m.ok ? "ok" : ("refused: " + m.error); }
}

// ---------------- recording follow ----------------
function setRecording(r) {
  const was = recording && recording.active, uidWas = recording && recording.uid;
  recording = r;
  $("rec").textContent = r.active ? r.name : "idle"; $("rec").className = "pill " + (r.active ? "ok" : "");
  if (r.active && !was) startCapture(); else if (!r.active && was) stopCapture(uidWas);
}

async function armCamera() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}, audio: false});
    $("cam").srcObject = mediaStream; armed = true; $("arm").textContent = "Camera armed"; $("arm").disabled = true;
    if (recording && recording.active) startCapture();
  } catch (e) { $("capinfo").textContent = "camera error: " + e.message; }
}
function startCapture() {
  if (!armed || !mediaStream || recorder) return;
  chunks = [];
  const mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  recorder = new MediaRecorder(mediaStream, mime ? {mimeType: mime} : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  captureStartServerMs = serverNow();
  recorder.start(1000);
  $("capinfo").textContent = "recording video for " + recording.name;
}
async function stopCapture(uid) {
  if (!recorder) return;
  const rec = recorder; recorder = null;
  await new Promise(res => { rec.onstop = res; rec.stop(); });
  const blob = new Blob(chunks, {type: rec.mimeType});
  const fd = new FormData(); fd.append("file", blob, "video");
  $("capinfo").textContent = `uploading ${(blob.size / 1e6).toFixed(1)} MB…`;
  try {
    const q = new URLSearchParams({uid, start_server_ms: captureStartServerMs, offset_ms: offset});
    const r = await fetch("/capture/upload?" + q, {method: "POST", body: fd});
    const j = await r.json();
    $("capinfo").textContent = j.ok ? `stored (video starts ${j.video_start_rel_s.toFixed(2)} s into the recording)` : "upload failed: " + JSON.stringify(j);
  } catch (e) { $("capinfo").textContent = "upload failed: " + e.message; }
}

// ---------------- IMU ----------------
async function armImu() {
  try {
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
      if (await DeviceMotionEvent.requestPermission() !== "granted") throw new Error("denied");
    }
    window.addEventListener("devicemotion", e => {
      if (!(recording && recording.active)) return;
      const a = e.accelerationIncludingGravity || {}, g = e.rotationRate || {};
      imuBuf.push([serverNow(), a.x || 0, a.y || 0, a.z || 0, g.alpha || 0, g.beta || 0, g.gamma || 0]);
      if (imuBuf.length >= 10) { send({type: "imu", uid: recording.uid, samples: imuBuf}); imuBuf = []; }
    });
    imuArmed = true; $("imu").textContent = "IMU armed"; $("imu").disabled = true;
  } catch (e) { $("capinfo").textContent = "IMU error: " + e.message; }
}

$("arm").onclick = armCamera; $("imu").onclick = armImu;
$("recstart").onclick = () => send({type: "cmd", action: "record_start", name: "phone"});
$("recstop").onclick = () => send({type: "cmd", action: "record_stop"});
$("estop").onclick = () => send({type: "cmd", action: "emergency_rest"});
connect();
</script>
</body>
</html>
