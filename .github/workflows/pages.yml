# Publishes the web UI (docs work offline; live pages connect to the laptop's hub) to GitHub Pages:
#   https://nikhil-k-v.github.io/genauto-steering/
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "README.md", "pc/tools/build_pages.py", "pc/steering/server/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python pc/tools/build_pages.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
