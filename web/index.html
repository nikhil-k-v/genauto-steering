<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen Auto steering</title>
<style>
  /* relative URLs: the same file is served by the hub at / and by GitHub Pages at /genauto-steering/ */
  @font-face { font-family: "Barlow"; font-weight: 400; src: url(fonts/Barlow-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 500; src: url(fonts/Barlow-Medium.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; src: url(fonts/Barlow-SemiBold.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url(fonts/BarlowSemiCondensed-Medium.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(fonts/IBMPlexMono-Regular.woff2) format("woff2"); }
  @font-face { font-family: "DejaVu Sans"; font-weight: 400; src: url(fonts/DejaVuSans-plot.woff2) format("woff2"); }

  /* Status colours are picked for red-green colour blindness (blue-green / amber / vermillion), and every
     status mark also has a shape: circle ok, triangle not ready, square fault, ring no data.
     Plot lines: solid = measured, dashed = setpoint, dotted = requested; colour = source.  */
  :root {
    --paper:#f4f5f6; --rail:#e6e9ec; --surface:#ffffff; --ink:#1b2129; --muted:#68717c; --faint:#a3aab3;
    --rule:#d2d6db; --hover:#eceff2; --select:#dee7f5; --signal:#0066aa; --well:#eceff3;
    --ok:#008062; --warn:#c47e00; --bad:#cd3e16;
    --rail-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 16px/1.5 "Barlow", "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .mono, code, pre { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 13px; }
  a { color: var(--signal); }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---- rail -------------------------------------------------------------------------------- */
  .rail { position: fixed; inset: 0 auto 0 0; width: var(--rail-w); background: var(--rail); padding: 22px 20px; overflow-y: auto; }
  .brand { font-weight: 600; font-size: 15px; color: var(--muted); }
  .nav { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 15px; margin: 14px 0 26px; }
  .nav a { color: var(--ink); text-decoration: none; padding: 4px 7px; border-radius: 4px; font-weight: 500; }
  .nav a:hover { background: var(--hover); }
  .nav a.on { background: var(--ink); color: var(--surface); }
  .state { font-size: 24px; font-weight: 600; }
  .state.bad { color: var(--bad); }
  .state-line { font-size: 15px; color: var(--muted); min-height: 22px; }
  .state-line.bad { color: var(--bad); } .state-line.warn { color: var(--warn); }
  .angle { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; font-weight: 500; font-size: 56px; line-height: 1.1; margin-top: 4px; }
  .target { font-size: 15px; color: var(--muted); min-height: 22px; }
  .chain { margin-top: 28px; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; align-items: baseline; position: relative; padding: 3px 0; }
  .row .name { font-weight: 500; }
  .row.link .name { font-weight: 400; color: var(--muted); font-size: 15px; }
  .row .val { color: var(--muted); font-size: 15px; }
  .row .why { grid-column: 2 / 4; font-size: 15px; }
  .row .mark { width: 10px; height: 10px; border-radius: 50%; align-self: center; position: relative; z-index: 1; }
  .row.link .mark { width: 0; height: 0; }
  .mark.s1 { background: var(--ok); }
  .mark.s2 { background: var(--warn); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 12px; height: 11px; }
  .mark.s3 { background: var(--bad); border-radius: 1px; }
  .mark.s0, .mark.off { background: transparent; border: 1.6px solid var(--faint); }
  .row .line { position: absolute; left: 4px; width: 2px; top: -2px; bottom: -2px; }
  .gap { height: 18px; }
  .event { margin-top: 22px; color: var(--muted); font-size: 12.5px; }
  .connect { margin: 0 0 22px; }
  .connect .row2 { display: flex; gap: 6px; }
  .connect input { flex: 1; min-width: 0; }
  .connect .note { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .connect .note.bad { color: var(--bad); }
  .connect .quick button { font-size: 14px; padding: 3px 8px; margin: 6px 6px 0 0; }
  .share { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 24px; align-items: start; }
  .share dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; }
  .share dt { color: var(--muted); } .share dd { margin: 0; word-break: break-all; }
  .share img { width: 170px; height: 170px; border: 1px solid var(--rule); border-radius: 6px; }
  .event.bad { color: var(--bad); } .event.warn { color: var(--warn); }
  .hub { margin-top: 10px; font-size: 14px; color: var(--muted); }

  /* ---- page -------------------------------------------------------------------------------- */
  main { margin-left: var(--rail-w); padding: 22px 28px 60px; }
  .sheet { background: var(--surface); border-radius: 6px; padding: 26px 30px 34px; max-width: 1300px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 20px; font-weight: 600; margin: 34px 0 8px; }
  h3 { font-size: 17px; font-weight: 600; margin: 22px 0 6px; }
  p.lead { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
  .muted { color: var(--muted); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; }
  .figure { width: 100%; border: 1px solid var(--rule); border-radius: 6px; display: block; background: #fff; }

  .checks .grp { margin: 18px 0 4px; font-weight: 600; font-size: 17px; }
  .checks .q { color: var(--muted); font-size: 14.5px; margin-bottom: 6px; }
  .check { display: grid; grid-template-columns: 22px 46px 200px 1fr; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .check:hover { background: var(--hover); } .check.on { background: var(--select); }
  .check .id { font-weight: 600; } .check .r { color: var(--muted); font-size: 15px; }
  .check .r.s2 { color: var(--warn); } .check .r.s3 { color: var(--bad); }
  .detail { position: sticky; top: 22px; }
  .detail dl { display: grid; grid-template-columns: 74px 1fr; gap: 8px 14px; margin: 14px 0; }
  .detail dt { color: var(--muted); font-size: 14.5px; } .detail dd { margin: 0; }
  .conn { display: grid; grid-template-columns: 22px 190px 1fr; gap: 4px 0; align-items: center; }
  .conn .r { color: var(--muted); }

  /* ---- recordings -------------------------------------------------------------------------- */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
  input, select { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; color: var(--ink); }
  input::placeholder { color: var(--faint); }
  button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  button.quiet { border-color: transparent; color: var(--muted); padding: 6px 8px; }
  button.danger { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 14px; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--hover); vertical-align: baseline; }
  tr.rec { cursor: pointer; } tr.rec:hover td { background: var(--hover); }
  tr.child td:first-child { padding-left: 30px; }
  td.n { font-weight: 500; } td.num { text-align: right; }
  .meta { color: var(--muted); max-width: 90ch; }
  .plot { width: 100%; height: 240px; display: block; }
  .plot.small { height: 140px; }
  .legend { font: 13px "DejaVu Sans", Verdana, sans-serif; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px 0 4px; }
  .legend i { display: inline-block; width: 24px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
  .legend i.dashed { border-top-style: dashed; } .legend i.dotted { border-top-style: dotted; }
  .results { display: grid; grid-template-columns: auto auto; gap: 4px 18px; }
  .results dt { color: var(--muted); } .results dd { margin: 0; }
  .log { max-height: 280px; overflow: auto; border: 1px solid var(--hover); border-radius: 4px; padding: 8px 10px; }
  .log div { white-space: pre-wrap; } .log .w { color: var(--warn); } .log .b { color: var(--bad); }
  .cursor { width: 100%; }
  .readout { color: var(--muted); margin-top: 4px; }

  /* ---- docs -------------------------------------------------------------------------------- */
  .docs { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 36px; }
  .doclist a { display: block; padding: 4px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; }
  .doclist a:hover { background: var(--hover); } .doclist a.on { background: var(--select); }
  .doclist .sub { color: var(--muted); font-size: 14px; margin: 18px 8px 4px; }
  .md { max-width: 820px; }
  .md h1 { font-size: 28px; } .md h2 { font-size: 21px; } .md h3 { font-size: 17px; }
  .md img { max-width: 100%; border: 1px solid var(--rule); border-radius: 6px; margin: 8px 0; }
  .md table { font-size: 15px; margin: 10px 0; } .md td, .md th { border: 1px solid var(--rule); padding: 5px 8px; }
  .md pre { background: var(--paper); padding: 10px 12px; border-radius: 4px; overflow: auto; }
  .md code { background: var(--paper); padding: 1px 4px; border-radius: 3px; }
  .md pre code { background: none; padding: 0; }

  @media (max-width: 900px) {
    .rail { position: static; width: auto; }
    main { margin-left: 0; padding: 14px 16px 40px; }
    .sheet { padding: 18px 16px; }
    .cols, .docs { grid-template-columns: 1fr; }
    .check { grid-template-columns: 22px 40px 1fr; } .check .r { grid-column: 2 / 4; }
    .detail { position: static; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">Gen Auto steering</div>
  <nav class="nav" id="nav">
    <a href="#system">System</a><a href="#recordings">Recordings</a><a href="#docs">Docs</a><a id="phoneLink" href="phone" title="Camera and IMU capture from a phone, synced to recordings">Phone</a>
  </nav>
  <div class="connect" id="connect" hidden>
    <label for="hubAddr" class="muted" style="font-size:14px">Laptop address</label>
    <div class="row2"><input id="hubAddr" placeholder="192.168.1.42:8765" autocomplete="off" spellcheck="false"
      title="The laptop running the steering app with its web hub on. Its address is on the app's Settings page.">
      <button class="primary" id="hubGo" title="On this laptop: connect here. On another device: open the laptop's own copy of these pages over your Wi-Fi.">Connect</button></div>
    <div class="quick"><button class="quiet" data-addr="localhost:8765" title="The steering app on this same computer">This computer</button><button class="quiet" data-addr="genauto.local:8765" title="The laptop's name on the Wi-Fi (needs zeroconf on the laptop; most phones and computers resolve .local names)">genauto.local</button></div>
    <div class="note" id="hubNote">Docs work without a connection.</div>
  </div>
  <div class="state" id="state">Connecting</div>
  <div class="state-line" id="stateLine">Waiting for the laptop app.</div>
  <div class="angle" id="angle">—</div>
  <div class="target" id="target"></div>
  <div class="chain" id="chain"></div>
  <div class="event mono" id="event"></div>
  <div class="hub" id="hubLine"></div>
</aside>
<main><div class="sheet" id="page"></div></main>

<script>
// ------------------------------------------------------------------ where am I?
// "hub":   served by the laptop's hub (http://<laptop>:8765/) - everything is same-origin.
// "pages": the GitHub Pages copy.  Docs are built in (api/*.json).  Live data needs the hub:
//          on the same laptop we talk to http://localhost:<port> directly (browsers treat localhost
//          as secure, the hub allows this origin); from any other device we hand over to the
//          laptop's own copy, because an https page may not call a plain-http device on the Wi-Fi.
const PAGES = location.hostname.endsWith(".github.io") || new URLSearchParams(location.search).has("pages");
const HUB_KEY = "genauto.hub";
let HUB = PAGES ? null : "";                       // base URL for API calls; null = no hub
const isLoopback = a => /^(localhost|127\.0\.0\.1|\[::1\])(:|$)/.test(a);
const normAddr = a => {
  a = (a || "").trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (a && !/:\d+$/.test(a)) a += ":8765";
  return a;
};
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

// ------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v; else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const api = async (p, o) => {
  if (HUB === null) throw new Error("not connected to the laptop");
  const r = await fetch(HUB + p, o); if (!r.ok) throw new Error(`${p} answered ${r.status}`); return r.json();
};
const staticJson = async p => { const r = await fetch(p); if (!r.ok) throw new Error(`${p} answered ${r.status}`); return r.json(); };
const num = (x, d = 1) => (x == null || isNaN(x)) ? "—" : Number(x).toFixed(d).replace("-", "−");
const signed = (x, d = 1) => (x == null || isNaN(x)) ? "—" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
// same words as the laptop app (pc/steering/words.py)
const VERDICT = ["no data", "ok", "not ready", "fault"];
const CS_WORD = ["Motor off", "Position control", "Following setpoints", "Running a test", "Free-spin", "Calibrating", "Safety stop"];
const RANK = [1, 0, 2, 3];
const ROWS = [["laptop", "Laptop", ["D1", "D2", "D5"], "node"], ["usb", "USB", ["C1", "C2", "C3", "C4", "C5", "C6"], "link"],
  ["teensy", "Teensy", ["T1", "T2", "T3", "T4"], "node"], ["can", "CAN", ["M1", "M2", "M3"], "link"],
  ["motor", "Motor", ["M4", "M5", "M6"], "node"], null, ["safety", "Safety", ["S1", "S2"], "node"], ["hub", "Web hub", ["D3", "D4"], "node"]];
const GROUP_TITLE = { C: "Laptop to Teensy link", S: "Safety", M: "Motor and CAN", T: "Teensy", D: "Data and services" };
// plot lines: colour = source / quantity, style = measured (solid) / setpoint (dashed) / requested (dotted)
const COLORS = { position: "#0066aa", user: "#00704a", playback: "#62ba84", trajectory: "#62ba84", planner: "#d68000",
  test: "#80858c", calib: "#80858c", torque: "#cd561a", error: "#5a6068", ink: "#1b2129", muted: "#68717c",
  well: "#eceff3", grid: "#ffffff", rule: "#d2d6db" };
const SOURCE_LABEL = { user: "Position control", playback: "playback", trajectory: "waveform", planner: "planner", test: "test", calib: "calibration" };
const DASH = { solid: [], dashed: [8, 5], dotted: [2, 4] };
const CS_SOURCE = { 1: "user", 3: "test", 5: "calib" };     // CS_HOLD, CS_TEST, CS_CALIB; CS_TRAJ depends on the kind

// ------------------------------------------------------------------ live state (rail)
const live = { t: null, health: null, status: null, events: [], ws: false, lastEvent: null, nodes: {} };
let sock = null;

function connect() {
  if (HUB === null) return;
  const base = HUB ? HUB.replace(/^http/, "ws") : (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
  const ws = new WebSocket(base + "/ws");
  sock = ws;
  ws.onopen = () => { live.ws = true; drawRail(); };
  ws.onclose = () => { live.ws = false; drawRail(); if (sock === ws) setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "telemetry") { live.t = m; drawHead(); }
    else if (m.type === "event" || m.type === "health_transition") {
      live.events.unshift(m); live.events = live.events.slice(0, 80); live.lastEvent = m; drawEvent();
    }
  };
}

async function poll() {
  if (HUB !== null) {
    try {
      [live.health, live.status] = await Promise.all([api("/api/health"), api("/status")]);
      drawRail();
      if (route().page === "system") drawChecks();
    } catch (e) { live.health = null; drawRail(); }
  }
  setTimeout(poll, 1000);
}

function rowState(nodes) {
  let worst = 1, wid = null, off = false;
  for (const id of nodes) {
    const n = live.nodes[id]; if (!n) continue;
    if (n.optional && n.state === 2) { if (id === nodes[0]) off = true; continue; }
    if (RANK[n.state] > RANK[worst]) { worst = n.state; wid = id; }
  }
  return { st: worst, wid, off };
}

function rowValues() {
  const t = live.t, s = live.status || {}, n = live.nodes;
  const v = {};
  const rec = s.recording || {};
  v.laptop = rec.active ? `recording ${rec.name || ""}` : "";
  v.usb = n.C4 && n.C4.state === 1 ? (s.telemetry_hz ? `${Math.round(s.telemetry_hz)} Hz` : "live") : (n.C1 && n.C1.state === 1 ? "silent" : "closed");
  v.teensy = n.T1 && n.T1.state === 1 ? n.T1.reason.split(",")[0] : "";
  v.can = n.M3 && n.M3.state === 1 ? n.M3.reason.replace(" frames/s received", " Hz") : "";
  v.motor = t && n.M4 && n.M4.state === 1 ? `${signed(t.cur)} A` : (n.M4 && n.M4.state !== 1 ? "no reply" : "");
  v.safety = n.S2 && n.S2.state === 3 ? "stopped" : (n.S1 && n.S1.state === 1 ? "armed" : n.S1 && n.S1.state === 2 ? "idle switch on" : "");
  v.hub = `${s.clients ?? 1} browser${(s.clients ?? 1) === 1 ? "" : "s"}`;
  return v;
}

function drawRail() {
  drawHead();
  const chain = $("#chain"); chain.innerHTML = "";
  if (!live.health) {
    chain.append(h("div", { class: "muted" }, HUB === null ? "" : live.ws ? "Loading checks…"
      : "The laptop isn't answering. Is the steering app running with Settings › Web hub turned on?"));
    return;
  }
  live.nodes = Object.fromEntries(live.health.nodes.map(n => [n.id, n]));
  const vals = rowValues();
  for (const r of ROWS) {
    if (!r) { chain.append(h("div", { class: "gap" })); continue; }
    const [key, label, nodes, kind] = r;
    const { st, wid, off } = rowState(nodes);
    const el = h("div", { class: "row " + kind, title: nodes.map(id => `${id} ${live.nodes[id].name}: ${live.nodes[id].state === 1 ? "ok" : live.nodes[id].reason || VERDICT[live.nodes[id].state]}`).join("\n") },
      h("span", { class: "mark " + (off ? "off" : "s" + st) }),
      h("span", { class: "name" }, label), h("span", { class: "val" }, vals[key] || ""),
      wid ? h("span", { class: "why", style: `color:var(--${st === 3 ? "bad" : st === 2 ? "warn" : "muted"})` },
        live.nodes[wid].reason || live.nodes[wid].name, h("span", { class: "muted" }, `  ${wid}`)) : null);
    el.dataset.key = key; el.dataset.st = st; el.style.cursor = "pointer";
    el.onclick = () => { location.hash = "#system/" + (wid || nodes[0]); };
    chain.append(el);
  }
  // the chain line between laptop..teensy (USB) and teensy..motor (CAN): coloured by the link, broken when not ok
  for (const [from, link, to] of [["laptop", "usb", "teensy"], ["teensy", "can", "motor"]]) {
    const st = Number(chain.querySelector(`[data-key=${link}]`).dataset.st);
    const col = ["var(--faint)", "var(--ok)", "var(--warn)", "var(--bad)"][st];
    const bg = st === 1 ? col : `repeating-linear-gradient(${col} 0 ${st === 0 ? 3 : 7}px, transparent ${st === 0 ? 3 : 7}px ${st === 0 ? 7 : 12}px)`;
    for (const k of [from, link]) {
      const el = chain.querySelector(`[data-key=${k}]`);
      el.append(h("span", { class: "line", style: `background:${bg};${k === from ? "top:50%;" : ""}` }));
    }
    chain.querySelector(`[data-key=${to}]`).append(h("span", { class: "line", style: `background:${bg};bottom:50%;top:-2px` }));
  }
  $("#hubLine").textContent = live.ws ? "" : HUB === null ? "" : "Live feed reconnecting…";
}

function drawHead() {
  const t = live.t, s = live.status || {};
  const st = $("#state"), line = $("#stateLine");
  if (HUB === null) {
    st.textContent = "Not connected"; st.className = "state";
    line.textContent = "Enter the laptop's address above."; line.className = "state-line";
    $("#angle").textContent = "—"; $("#target").textContent = ""; return;
  }
  if (!t) {
    st.textContent = live.health ? "Waiting for the Teensy" : "Connecting"; st.className = "state";
    line.textContent = live.health ? "No telemetry yet: see the USB row below." : "Waiting for the laptop app."; line.className = "state-line";
    $("#angle").textContent = "—"; $("#target").textContent = ""; return;
  }
  st.textContent = (t.cs === 2 && s.state_word) ? s.state_word : (CS_WORD[t.cs] || t.cs);
  st.className = "state" + (t.cs === 6 ? " bad" : "");
  line.textContent = t.cs === 6 ? (s.trip || "") : ""; line.className = "state-line" + (t.cs === 6 ? " bad" : "");
  $("#angle").textContent = `${signed(t.pos)}°`;
  const src = t.src || "";
  $("#target").textContent = src ? `setpoint ${signed(t.sp)}°` : "";
  $("#target").style.color = src ? COLORS[src] : "";
}

function drawEvent() {
  const m = live.lastEvent, el = $("#event"); if (!m) return;
  const time = new Date().toTimeString().slice(0, 5);
  if (m.type === "event") {
    if (!m.say) return;
    el.textContent = `${time}  ${m.say}`; el.className = "event mono" + (m.level === "bad" ? " bad" : m.level === "warn" ? " warn" : "");
  } else {
    const to = { OK: "ok", BLOCKED: "not ready", FAIL: "fault", UNKNOWN: "no data" }[m.to] || m.to;

    el.className = "event mono" + (m.to === "FAIL" ? " bad" : m.to === "BLOCKED" ? " warn" : "");
  }
}

// ------------------------------------------------------------------ connecting (GitHub Pages copy only)
function setupConnect() {
  const box = $("#connect");
  if (!PAGES) { $("#phoneLink").setAttribute("href", "phone"); return; }
  box.hidden = false;
  const input = $("#hubAddr"), note = $("#hubNote");
  const say = (txt, bad) => { note.textContent = ""; note.append(...[].concat(txt)); note.className = "note" + (bad ? " bad" : ""); };
  const params = new URLSearchParams(location.search);
  const fromLink = normAddr(params.get("hub"));
  input.value = fromLink || store.get(HUB_KEY) || "";

  async function go(addr, auto) {
    addr = normAddr(addr);
    if (!addr) { say("Type the address shown on the laptop's Settings page, e.g. 192.168.1.42:8765.", true); return; }
    store.set(HUB_KEY, addr);
    input.value = addr;
    if (!isLoopback(addr)) {
      // another machine: the browser won't let this https page call it, so open the laptop's own copy
      say(`Opening http://${addr}/ …`);
      location.href = `http://${addr}/${location.hash}`;
      return;
    }
    say(`Connecting to http://${addr} …`);
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
      const r = await fetch(`http://${addr}/api/info`, { signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
      const info = await r.json();
      HUB = `http://${addr}`;
      $("#phoneLink").setAttribute("href", `${HUB}/phone`);
      say(["Connected to the app on this computer. ", h("a", { href: `${HUB}/${location.hash}` }, "Open its own copy")]);
      connect(); render();
    } catch (e) {
      if (auto) { say("Docs work without a connection."); return; }
      say([`No answer from http://${addr}. Is the steering app running with Settings › Web hub on? `,
           h("a", { href: `http://${addr}/` }, "Try opening it directly")], true);
    }
  }
  $("#hubGo").onclick = () => go(input.value);
  input.onkeydown = e => { if (e.key === "Enter") go(input.value); };
  for (const b of box.querySelectorAll(".quick button")) b.onclick = () => go(b.dataset.addr);
  $("#phoneLink").onclick = e => {
    const a = normAddr(input.value || store.get(HUB_KEY));
    if (HUB === null) { e.preventDefault(); if (a && !isLoopback(a)) location.href = `http://${a}/phone`; else say("Connect to the laptop first: the phone page is served by it.", true); }
  };
  if (fromLink) go(fromLink, false);                          // a QR / bookmark link: go straight there
  else if (input.value && isLoopback(input.value)) go(input.value, true);   // quietly retry this computer
}

// small canvas plotter: no dependencies, works offline at the track.  Inset well, white grid, DejaVu Sans,
// line style per series (solid measured / dashed setpoint / dotted requested).
function plot(canvas, t, series, cursorT) {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
  const L = 50, R = 12, T = 6, B = 22;
  const vals = series.flatMap(([ys]) => ys.filter(v => v != null)); if (!vals.length) return;
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const t0 = t[0], t1 = t[t.length - 1] || 1;
  const X = v => L + (v - t0) / (t1 - t0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  ctx.fillStyle = COLORS.well; ctx.fillRect(L, T, W - L - R, H - T - B);
  ctx.strokeStyle = COLORS.rule; ctx.lineWidth = 1; ctx.strokeRect(L + 0.5, T + 0.5, W - L - R - 1, H - T - B - 1);
  ctx.font = '12px "DejaVu Sans", Verdana, sans-serif'; ctx.fillStyle = COLORS.muted; ctx.strokeStyle = COLORS.grid;
  const raw = (hi - lo) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(k => k * mag).find(s => s >= raw);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { const y = Y(v); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke(); ctx.fillText((Math.abs(v) < step / 2 ? 0 : v).toFixed(step < 1 ? 1 : 0).replace("-", "−"), 4, y + 4); }
  for (let i = 0; i <= 6; i++) { const v = t0 + (t1 - t0) * i / 6, x = X(v); ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, H - B); ctx.stroke(); ctx.fillText(v.toFixed(1) + " s", x - 12, H - 5); }
  for (const [ys, col, sty] of series) {
    ctx.strokeStyle = col; ctx.lineWidth = sty === "solid" ? 1.9 : sty === "dashed" ? 1.8 : 1.6; ctx.setLineDash(DASH[sty] || []);
    ctx.beginPath(); let pen = false;
    for (let i = 0; i < ys.length; i++) { const v = ys[i]; if (v == null) { pen = false; continue; } const x = X(t[i]), y = Y(v); if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  if (cursorT != null) { ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 1; const x = X(cursorT); ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, H - B); ctx.stroke(); }
}

    h("div", { class: "sub" }, "Diagrams"), ...DIAGRAMS.map(([f, l]) => h("a", { href: "diagrams/" + f + ".svg", target: "_blank" }, l)));
  const body = h("article", { class: "md" }, "Loading…");
  root.append(h("div", { class: "docs" }, nav, body));
  if (id) {
    const d = await get("/api/docs/" + id); body.innerHTML = d.html;
    for (const a of body.querySelectorAll("a[href$='.md']")) { const m = a.getAttribute("href").match(/([A-Z_]+)\.md/); if (m) a.setAttribute("href", "#docs/" + m[1]); }
  }
}

setupConnect(); connect(); poll(); render(); drawRail();
</script>
</body>
</html>
