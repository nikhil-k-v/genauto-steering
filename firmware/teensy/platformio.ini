; Gen Auto steering controller — Teensy 4.1
;
;   pio run -e teensy41            (wired: PC over USB)
;   pio run -e teensy41_wireless   (PC over NRF24 via the Arduino bridge)
;   pio run -e teensy41 -t upload
;
; The shared protocol header and splash bitmap live in ../../protocol.

[platformio]
default_envs = teensy41

[env]
platform  = teensy
board     = teensy41
framework = arduino
monitor_speed = 2000000
lib_deps =
    nrf24/RF24 @ ^1.4.8
    olikraus/U8g2 @ ^2.35.19
build_flags =
    -O2
    -I../../protocol
    -ffunction-sections
    -fdata-sections
    -Wall

[env:teensy41]
build_flags = ${env.build_flags} -DWIRED_MODE=1

[env:teensy41_wireless]
build_flags = ${env.build_flags} -DWIRED_MODE=0
