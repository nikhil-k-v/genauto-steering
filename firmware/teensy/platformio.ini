; Gen Auto steering controller — Teensy 4.1 (CCM)
;
;   pio run                 build
;   pio run -t upload       flash
;
; The shared protocol header and splash bitmap live in ../../protocol.

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino
monitor_speed = 2000000
lib_deps =
    olikraus/U8g2 @ ^2.35.19
build_flags =
    -O2
    -I../../protocol
    -ffunction-sections
    -fdata-sections
    -Wall
