; Arduino Uno — joystick + NRF24 bridge + OLED
;
;   pio run -e uno              (joystick + status only; PC wired to Teensy)
;   pio run -e uno_bridge       (also forwards PC <-> Teensy packets over RF)

[platformio]
default_envs = uno

[env]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ ^1.4.8
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
build_flags = -I../../protocol -Os

[env:uno]
build_flags = ${env.build_flags} -DPC_VIA_BRIDGE=0

[env:uno_bridge]
build_flags = ${env.build_flags} -DPC_VIA_BRIDGE=1
