<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="1400" height="620" fill="#0f1218"/><defs><marker id="ah-5a6278" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6278"/></marker><marker id="ahr-5a6278" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5a6278"/></marker></defs><defs><marker id="ah-e85555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e85555"/></marker><marker id="ahr-e85555" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e85555"/></marker></defs><defs><marker id="ah-4eca7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4eca7a"/></marker><marker id="ahr-4eca7a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4eca7a"/></marker></defs><text x="24" y="34" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Firmware controller states (CS_*) and what moves between them</text><rect x="24" y="50" width="470" height="38" rx="8" fill="#141821" stroke="#5a6278" stroke-width="1"/><rect x="38" y="60" width="22" height="16" rx="8" fill="#1a1f2c" stroke="#8a92a4" stroke-width="1.5"/><text x="68" y="73" fill="#8a92a4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">state</text><line x1="188" y1="68" x2="210" y2="68" stroke="#8a92a4" stroke-width="2.5"/><text x="218" y="73" fill="#8a92a4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">command / event</text><line x1="338" y1="68" x2="360" y2="68" stroke="#8a92a4" stroke-width="2.5" stroke-dasharray="5 4"/><text x="368" y="73" fill="#8a92a4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">automatic</text><rect x="80" y="130" width="220" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="190.0" y="158.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">REST</text><text x="190.0" y="176.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">MOSFETs off, wheel free</text><rect x="1100" y="130" width="220" height="64" rx="32.0" fill="#1a1f2c" stroke="#e85555" stroke-width="2"/><text x="1210.0" y="158.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TRIPPED</text><text x="1210.0" y="176.0" fill="#e85555" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">latched until CLEAR_TRIP</text><rect x="80" y="270" width="1240" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="700.0" y="298.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">HOLD</text><text x="700.0" y="316.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">FOC on, servo to the setpoint (slider / hold-here) - the home state while enabled</text><path d="M140.0,194 L140.0,270" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="-14.0" y="220.5" width="308" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="140.0" y="235.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">ENABLE  (switch armed, CAN alive, no trip)</text><path d="M250.0,270 L250.0,194" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="218.5" y="220.5" width="63" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="250.0" y="235.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">DISABLE</text><path d="M1210.0,130 L1210,100 L190,100 L190.0,130" fill="none" stroke="#e85555" stroke-width="2.5"  marker-end="url(#ah-e85555)"/><rect x="658.0" y="88.5" width="84" height="23" rx="5" fill="#0f1218" stroke="#e85555" stroke-width="1"/><text x="700.0" y="103.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">CLEAR_TRIP</text><path d="M1210.0,270 L1210.0,194" fill="none" stroke="#e85555" stroke-width="2.5"  marker-end="url(#ah-e85555)"/><rect x="1175.0" y="220.5" width="70" height="23" rx="5" fill="#0f1218" stroke="#e85555" stroke-width="1"/><text x="1210.0" y="235.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">any trip</text><rect x="80" y="440" width="280" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="220.0" y="468.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FOLLOW</text><text x="220.0" y="486.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">setpoint stream 200 Hz</text><path d="M175.0,334 L175.0,440" fill="none" stroke="#5a6278" stroke-width="2.5" stroke-dasharray="7 5"  marker-end="url(#ah-5a6278)"/><rect x="66.5" y="345.5" width="217" height="23" rx="5" fill="#0f1218" stroke="#5a6278" stroke-width="1"/><text x="175.0" y="360.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">stream fresh (mode AUTO/TRAJ)</text><path d="M265.0,440 L265.0,334" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="149.5" y="405.5" width="231" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="265.0" y="420.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">stream stale 250 ms / HOLD_HERE</text><rect x="400" y="440" width="280" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="540.0" y="468.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TEST</text><text x="540.0" y="486.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">step / relay on the Teensy</text><path d="M495.0,334 L495.0,440" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="421.5" y="345.5" width="147" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="495.0" y="360.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">TEST_START (zeroed)</text><path d="M585.0,440 L585.0,334" fill="none" stroke="#5a6278" stroke-width="2.5" stroke-dasharray="7 5"  marker-end="url(#ah-5a6278)"/><rect x="511.5" y="405.5" width="147" height="23" rx="5" fill="#0f1218" stroke="#5a6278" stroke-width="1"/><text x="585.0" y="420.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">test done / PC lost</text><rect x="720" y="440" width="280" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="860.0" y="468.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FREESPIN</text><text x="860.0" y="486.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">zero torque, backdrivable</text><path d="M815.0,334 L815.0,440" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="769.5" y="345.5" width="91" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="815.0" y="360.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">FREESPIN_ON</text><path d="M905.0,440 L905.0,334" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="782.5" y="405.5" width="245" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="905.0" y="420.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">FREESPIN_OFF (re-grip, gain ramp)</text><rect x="1040" y="440" width="280" height="64" rx="32.0" fill="#1a1f2c" stroke="#4eca7a" stroke-width="2"/><text x="1180.0" y="468.0" fill="#e6e9f0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CALIB</text><text x="1180.0" y="486.0" fill="#4eca7a" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">end stops + zero</text><path d="M1135.0,334 L1135.0,440" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="1030.0" y="345.5" width="210" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="1135.0" y="360.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">CALIB_START / GO_CENTER_ZERO</text><path d="M1225.0,440 L1225.0,334" fill="none" stroke="#4eca7a" stroke-width="2.5"  marker-end="url(#ah-4eca7a)"/><rect x="1134.0" y="405.5" width="182" height="23" rx="5" fill="#0f1218" stroke="#4eca7a" stroke-width="1"/><text x="1225.0" y="420.5" fill="#e6e9f0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle">CAL_DONE: zero at centre</text><text x="80" y="560" fill="#8a92a4" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">Also from REST: FREESPIN_ON -&gt; FREESPIN, CALIB_START -&gt; CALIB.  Every enabled state goes to TRIPPED on: overspeed, stall, overcurrent,</text><text x="80" y="580" fill="#8a92a4" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">switch opened, motor CAN lost, past end stop, calibration failed, ISR overrun, PC lost while FOLLOWING.  DISABLE from any state -&gt; REST.</text></svg>