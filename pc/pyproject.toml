[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genauto-steering"
version = "2.0.0"
description = "Gen Auto steering actuator: PC control, health tree, data store, UI, device hub"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "dearpygui>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "python-multipart>=0.0.9", "markdown>=3.5",
          "zeroconf>=0.130", "segno>=1.6"]   # zeroconf: genauto.local on the Wi-Fi; segno: QR codes
dev = ["pytest>=8"]

[project.scripts]
steering = "steering.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["steering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
steering = ["ui/fonts/*.ttf", "ui/fonts/FONTS.md"]
